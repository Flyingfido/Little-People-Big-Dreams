  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-14px); } }
  body::before {
    content: '';

    background-position: 10px 10px, 40px 40px, 25px 70px;
    opacity: 0.08; pointer-events: none; z-index: 0;
  }
  header {
    position: relative; z-index: 1;

  header h1 {
    font-family: 'Pacifico', cursive;
    font-size: clamp(1.6rem, 5vw, 2.8rem); color: white;

  .filter-btn { padding: 0.6rem 1.1rem; border: 3px solid #E8E0D8; border-radius: 50px; background: white; font-family: 'Nunito', sans-serif; font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .filter-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

  .grid { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; padding: 0 1rem 2rem; max-width: 1000px; margin: 0 auto; }
  .book-card { background: white; border-radius: 18px; padding: 1rem 0.8rem; text-align: center; cursor: default; transition: all 0.25s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.06); border: 3px solid transparent; position: relative; user-select: none; }

const seen = new Set();
const uniqueBooks = books.filter(b => { if (seen.has(b.name)) return false; seen.add(b.name); return true; });
uniqueBooks.sort((a, b) => a.name.localeCompare(b.name));

const catColors = { "Art":"#E8D5FF","Music":"#FFE0F0","Science":"#D5F0FF","Writing":"#FFE8D5","Activism":"#FFD5D5","Sport":"#D5FFE8","Leadership":"#FFF5D5","Adventure":"#D5FFE5","Film":"#FFD5FF","Fashion":"#FFE5D5","History":"#E5E5FF" };
const catEmoji = { "Art":"🎨","Music":"🎵","Science":"🔬","Writing":"✍️","Activism":"✊","Sport":"🏅","Leadership":"🌟","Adventure":"🧭","Film":"🎬","Fashion":"👗","History":"📚" };

let state = {};
try {
  const oldSaved = localStorage.getItem('lpbd_collection_v2');
  if (oldSaved) state = JSON.parse(oldSaved);
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) state = JSON.parse(saved);
} catch(e) {}

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

let currentFilter = 'all';
let currentCatFilter = null;
let searchQuery = '';

function updateStats() {
  const ownedCount = uniqueBooks.filter(b => state[b.name]?.owned).length;
  const wishCount = uniqueBooks.filter(b => state[b.name]?.wish && !state[b.name]?.owned).length;
  const total = uniqueBooks.filter(b => !b.isNew).length;
  document.getElementById('owned-count').textContent = ownedCount;
  document.getElementById('total-count').textContent = total;
  document.getElementById('wish-count').textContent = wishCount;
  document.getElementById('footer-count').textContent = uniqueBooks.length;
  const pct = total > 0 ? Math.round((ownedCount / total) * 100) : 0;
  document.getElementById('pct-label').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
}

function buildLegend() {
  const cats = [...new Set(uniqueBooks.map(b => b.cat))].sort();
  const wrap = document.getElementById('cat-legend');
  wrap.innerHTML = cats.map(c => `<div class="legend-item${currentCatFilter === c ? ' active' : ''}" data-cat="${c}">${catEmoji[c] || '📚'} ${c}</div>`).join('');
  wrap.querySelectorAll('.legend-item').forEach(el => {
    el.addEventListener('click', () => {
      const cat = el.dataset.cat;
      currentCatFilter = currentCatFilter === cat ? null : cat;
      buildLegend(); renderGrid();
    });
  });
}

function renderGrid() {
  const grid = document.getElementById('grid');
  let filtered = uniqueBooks.filter(b => {
    const bs = state[b.name] || {};
    if (currentFilter === 'owned' && !bs.owned) return false;
    if (currentFilter === 'wishlist' && !bs.wish) return false;
    if (currentFilter === 'new' && !b.isNew) return false;
    if (currentCatFilter && b.cat !== currentCatFilter) return false;
    if (searchQuery && !b.name.toLowerCase().includes(searchQuery)) return false;
    return true;
  });

  if (!filtered.length) {
    grid.innerHTML = `<div class="no-results"><span class="emoji">🔍</span>No books found!<br><small>Try a different search</small></div>`;
    return;
  }

  grid.innerHTML = filtered.map(b => {
    const bs = state[b.name] || {};
    const bg = catColors[b.cat] || '#f5f5f5';
    const badge = bs.owned ? '<div class="book-badge badge-owned">✓</div>' : bs.wish ? '<div class="book-badge badge-wish">⭐</div>' : b.isNew ? '<div class="book-badge badge-new">NEW</div>' : '';
    return `<div class="book-card${bs.owned ? ' owned' : ''}${bs.wish && !bs.owned ? ' wishlist-item' : ''}${b.isNew ? ' new-book' : ''}" data-name="${b.name}">
      ${badge}
      <div class="book-emoji" style="background:${bg}">${b.emoji}</div>
      <div class="book-name">${b.name}</div>
      <div class="book-category">${catEmoji[b.cat] || ''} ${b.cat}</div>
      <div class="book-year">${b.year}${b.isNew ? ' · Coming Soon' : ''}</div>
      <div class="mini-btns">
        <button class="mini-btn own-btn${bs.owned ? ' active' : ''}" data-name="${b.name}" data-action="own">I have it</button>
        <button class="mini-btn wish-btn${bs.wish && !bs.owned ? ' active' : ''}" data-name="${b.name}" data-action="wish">Want it</button>
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.mini-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const name = btn.dataset.name;
      const action = btn.dataset.action;
      if (!state[name]) state[name] = {};
      if (action === 'own') {
        state[name].owned = !state[name].owned;
        if (state[name].owned) state[name].wish = false;
      } else {
        if (!state[name].owned) state[name].wish = !state[name].wish;
      }
      save(); updateStats(); renderGrid();
    });
  });
  updateStats();
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderGrid();
  });
});

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.toLowerCase().trim();
  renderGrid();
});

buildLegend();
renderGrid();
updateStats();

// Dismiss splash screen after a short delay
window.addEventListener('load', () => {
  setTimeout(() => {
    const splash = document.getElementById('splash');
    if (splash) splash.classList.add('hidden');
  }, 1200);
});

// Register Service Worker for offline support
if ('serviceWorker' in navigator) {
  const swCode = `
const CACHE = 'lpbd-v1';
const FONTS = [
  'https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&display=swap',
  'https://fonts.gstatic.com'
];

self.addEventListener('install', e => {
  e.waitUntil(
    caches.open(CACHE).then(cache => cache.addAll([]))
  );
  self.skipWaiting();
});

self.addEventListener('activate', e => {
  e.waitUntil(clients.claim());
});

self.addEventListener('fetch', e => {
  // Cache-first for font requests, network-first for everything else
  if (e.request.url.includes('fonts.g')) {
    e.respondWith(
      caches.match(e.request).then(cached => {
        if (cached) return cached;
        return fetch(e.request).then(res => {
          const clone = res.clone();
          caches.open(CACHE).then(cache => cache.put(e.request, clone));
          return res;
        }).catch(() => cached);
      })
    );
  }
});
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}
</script>
